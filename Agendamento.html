<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Chinelo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Mundo Chinelo</h1>
        <nav>
            <a href="index.html">Início</a> <br>
            <a href="Catalogo.html">Catalogo</a> <br>
            <a href="Historia.html">Historia</a> <br>
            <a href="Agendamento.html">Agendamento</a>
        </nav>
    </header>

    <main>
        <h2>Agende sua consulta</h2>
        <form action="#" method="post">
            <label for="nome">Nome Completo</label>
            <input type="text" name="nome" id="nome" required>
            <br>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required>
            <br>
            <label for="telefone">Telefone</label>
            <input 
                 type="tel" 
                 name="telefone" 
                 id="telefone" 
                 required
                 inputmode="numeric"
                 maxlength="15"
                 pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                 title="Digite com DDD. Ex: (17) 98765-4321 ou 17987654321"
            >

            <br>
            <label for="data">Data(Dia/mês/ano)</label>
            <input type="date" name="data" id="data" required>
            <br>
            <label for="hora">Hora que deseja marcar</label>
            <input type="time" name="hora" id="hora" required>
            <br>
            <label for="especialidades">Especialidades</label>
            <select name="especialidades" id="especialidades" >
                <option value="">Selecione uma opção de tamanho</option>
                <option value="tamanho">33/34</option>
                <option value="tamanho">35/36</option>
                <option value="tamanho">37/38</option>
                <option value="tamanho">39/40</option>
                <option value="tamanho">41/42</option>
                <option value="tamanho">43/44</option>
                <option value="tamanho">45/46</option>
                <option value="tamanho">47/48</option>
                <option value="tamanho">49/50</option>
                
            </select>           
            <br>
           <label for="mensagem">Mensagem</label>
           <textarea name="mensagem" id="mensagem" rows="4"></textarea>
           <br>
           <button type="submit">Confirmar agendamento</button>
        </form>

    </main>

        <footer>
                <p>
             A <strong>Chinelaria Mundo</strong> ofere vários modelos, com agendamento rápido e
            simples pela internet.
        </p>
        <p>
            &copy; Mundo Chinelo - todos os modelos com modelos e ótimo atendimento.
        </p>
        
    </footer>
  
</body>
</html>
